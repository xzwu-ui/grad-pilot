[project]
name = "grad-pilot"
version = "0.4.0"
description = "Local-first, Git-driven PhD application and academic outreach workspace"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GradPilot User" }]
dependencies = [
  "beautifulsoup4>=4.12.3,<5",
  "google-api-python-client>=2.150.0,<3",
  "google-auth-httplib2>=0.2.0,<1",
  "google-auth-oauthlib>=1.2.1,<2",
  "jinja2>=3.1.3,<4",
  "jsonschema>=4.21.1,<5",
  "pyyaml>=6.0.1,<7",
  "requests>=2.31.0,<3",
  "rich>=13.7.0,<15",
  "tzdata>=2024.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
