  pivot_summary: >-
    Training in Big Data Management and Applications is presented as preparation in
    mathematical modeling, probability and statistical decision-making, optimization,
    large-scale data pipelines, and Markov decision processes. These foundations support
    simulation-at-scale reinforcement learning and data-driven behavioral foundation models.
  hardware_moat: >-
    Closed-loop deployment on Unitree G1/H2 humanoids and Inspire dexterous hands,
    including onboard perception and control on Jetson Orin NX, policy export with ONNX
    Runtime, and iterative sim-to-real diagnosis on physical systems.
  research_agenda: >-
    Build generalizable humanoid loco-manipulation policies that combine scalable
    reinforcement learning, visuomotor representations, motion retargeting, and
    hardware-grounded evaluation.

