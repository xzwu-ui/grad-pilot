name: Deploy dashboard demo to GitHub Pages

# Builds the public demo from the anonymized example data on main.
# Private databases (data/*.private.*) are git-ignored and never reach CI.
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "data/applications.example.json"
      - "data/profile.yaml"
      - "data/schema.json"
      - "scripts/dashboard_sync.py"
      - "scripts/common.py"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Generate anonymized demo data
        run: uv run python scripts/dashboard_sync.py --data data/applications.example.json --profile data/profile.yaml

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - id: deployment
        uses: actions/deploy-pages@v4
